<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GVT War Room</title>
<!--
  CARD-WRX (jumpr 4686) · THE WAR ROOM ON GVT'S OWN SITE, BEHIND A PASSWORD (Wyatt 11/25/2026: "Just put it behind a password and host it" · "don't put it
  on Nation's website. That's a completely different game."). Served at https://playgvt.net/warroom/ from the playgvt repo (beside /bench/ and /navigator/).
  The password is turned into a key here, in the browser: SHA-256 of "gvt-war-room|" + the password. HQ holds the War Room file under that key (the box's
  /var/lib/gvt-export/key-pass; HQ's keyed door, which answers any page). Nothing secret is in this file. Once the key opens the file, the key's link is kept
  in this browser under the War Room's own name (the same name Skylar's page reads at its start), and Skylar's newest page is fetched from his site and written
  here in place: it then connects by itself. "Forget the link" on its Real data page brings this password page back.
  The source of record: ~/gvt/design/war-room-export-1124/kit/site/warroom/index.html.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #10170f; color: #eef2e8; font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { width: 100%; max-width: 380px; }
  h1 { margin: 0 0 6px; font: 800 34px/1.05 Impact, "Arial Narrow Bold", system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  h1 b { color: #7fc45a; font-weight: inherit; }
  p.sub { margin: 0 0 26px; color: #a9b5a0; font-size: 15px; }
  label { display: block; margin: 0 0 8px; font-weight: 600; font-size: 15px; color: #cfd8c7; }
  input { width: 100%; box-sizing: border-box; padding: 14px 14px; font-size: 18px; color: #eef2e8; background: #1a2418; border: 1px solid #3c5236; border-radius: 10px; outline: none; }
  input:focus { border-color: #7fc45a; box-shadow: 0 0 0 3px rgba(127,196,90,.25); }
  button { margin-top: 14px; width: 100%; padding: 14px; font-size: 18px; font-weight: 700; color: #0e150d; background: #7fc45a; border: 0; border-radius: 10px; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  #msg { min-height: 1.45em; margin: 14px 0 0; font-size: 15px; color: #e9c46a; }
  #msg.ok { color: #a9b5a0; }
  [hidden] { display: none !important; }
</style>
</head><body>
<main id="gate" hidden>
  <h1>GVT <b>War Room</b></h1>
  <p class="sub">Green vs Tan's players, for the team.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Open</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<p id="wait" class="sub" style="text-align:center" role="status">Opening the War Room…</p>
<script>
(function () {
  'use strict';
  var HQ_KEY = 'gvt-war-room-hq-link';                      // the name Skylar's page reads its HQ link from at its start
  var DOOR = 'https://nationgame.live/gvt/export.json?key=';  // GVT's HQ (the game reports to the same server): the War Room file, behind a key
  var PAGE = 'https://skypilot82.github.io/gvt-war-room/';    // Skylar's War Room, always his newest
  var $ = function (id) { return document.getElementById(id); };
  // once the War Room is written in place, this page's own parts are gone: every reach into them is guarded
  function say(t, ok) { var m = $('msg'); if (m) { m.textContent = t || ''; m.className = ok ? 'ok' : ''; } }
  function gate(t) { var w = $('wait'), g = $('gate'); if (w) w.hidden = true; if (g) g.hidden = false; say(t); try { $('pw').focus(); } catch (e) {} }
  function saved() { try { return localStorage.getItem(HQ_KEY) || ''; } catch (e) { return ''; } }
  function keep(v) { try { if (v) localStorage.setItem(HQ_KEY, v); else localStorage.removeItem(HQ_KEY); } catch (e) {} }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function keyOf(pw) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode('gvt-war-room|' + pw)).then(hex); }
  function check(link) { return fetch(link, { method: 'HEAD', cache: 'no-store' }).then(function (r) { return r.status; }); }
  function open() {
    var g = $('gate'), w = $('wait'); if (g) g.hidden = true; if (w) w.hidden = false;
    return fetch(PAGE, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('page ' + r.status);
      return r.text();
    }).then(function (html) {
      if (!/<title>GVT War Room<\/title>/.test(html)) throw new Error('not the War Room');
      // its sample file is a relative link: point it at Skylar's site, where it lives
      html = html.split("'gvt-player-export-v1.sample.json'").join("'" + PAGE + "gvt-player-export-v1.sample.json'");
      document.open(); document.write(html); document.close();
    }).catch(function () { gate('Could not load the War Room page from Skylar’s site. Try again in a minute.'); });
  }
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = ($('pw').value || '').trim(); if (!pw) return;
    $('go').disabled = true; say('Checking…', true);
    keyOf(pw).then(function (k) {
      var link = DOOR + k;
      return check(link).then(function (st) {
        if (st === 200) { keep(link); return open(); }
        say(st === 403 ? 'That is not the password.' : st === 429 ? 'Too many tries. Wait a minute, then try again.' : 'HQ did not answer (' + st + '). Try again.');
      });
    }).catch(function () { say('HQ did not answer. Check the connection and try again.'); })
      .then(function () { var b = $('go'); if (b) b.disabled = false; });
  });
  if (!(window.crypto && crypto.subtle && window.TextEncoder && window.fetch)) { gate('This browser is too old for the War Room.'); return; }
  var s = saved();
  if (s.indexOf(DOOR) === 0) {
    check(s).then(function (st) {
      if (st === 200) return open();
      if (st === 403) { keep(''); gate('The password has changed. Enter it again.'); } else gate(st === 429 ? 'Too many tries. Wait a minute, then try again.' : '');
    }).catch(function () { gate('HQ did not answer. Check the connection and try again.'); });
  } else gate('');
})();
</script>
</body></html>
